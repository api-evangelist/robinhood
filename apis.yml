aid: robinhood
name: Robinhood
description: >-
  Robinhood Markets is a US financial-services company offering commission-free trading of stocks, ETFs,
  options, and cryptocurrency, plus retirement accounts, a cash/spending card, and 24-hour markets. For
  developers, Robinhood publishes the Crypto Trading API, a REST interface at trading.robinhood.com that
  lets an account holder view buying power and holdings, pull market data (best bid/ask and estimated fill
  prices), enumerate supported trading pairs, and place, retrieve, and cancel crypto orders (market, limit,
  stop-loss, and stop-limit). The API authenticates each request with an API key plus an Ed25519 request
  signature carried in the x-api-key, x-timestamp, and x-signature headers. Robinhood was added to the API
  Evangelist network as a VC-portfolio lead and enriched from its public developer surface.
